services:
  backend:
    build: ./backend
    container_name: personal-news-backend
    ports:
      - "8000:8000"
    volumes:
      - news_data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: personal-news-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  news_data:
